<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa dei luoghi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; width: 100%; }
  #filtro {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: #fff; padding: 6px 8px; border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,.4); font-size: 13px;
  }
  #stato {
    position: absolute; bottom: 8px; left: 8px; z-index: 1000;
    background: rgba(255,255,255,.9); padding: 3px 8px; border-radius: 4px; font-size: 12px;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="filtro">
  <label>Tipo: <select id="tipo"><option value="">Tutti</option></select></label>
</div>
<div id="stato">Caricamento…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
// === CONFIGURAZIONE ===
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSAP6CVHdSnwTtoXXL9ooLua0_ndMOTw7bqggnAYeNgaZ-Ui6ilziLl78ml3fKi9YJSyIHmymVHSluY/pub?gid=787359485&single=true&output=csv";
const REFRESH_MS = 5 * 60 * 1000; // ricarica i dati ogni 5 minuti mentre la pagina è aperta
// ======================

const map = L.map("map").setView([41.5, 9.5], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>"
}).addTo(map);

const layer = L.layerGroup().addTo(map);
const select = document.getElementById("tipo");
const stato = document.getElementById("stato");
let righe = [];

const colori = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#008080","#9a6324","#800000","#808000","#000075"];
const colorePerTipo = {};
function colore(t) {
  if (!(t in colorePerTipo)) colorePerTipo[t] = colori[Object.keys(colorePerTipo).length % colori.length];
  return colorePerTipo[t];
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function disegna() {
  layer.clearLayers();
  const filtro = select.value;
  const punti = [];
  let senzaCoord = 0;

  righe.forEach(r => {
    const lat = parseFloat(String(r.Latitudine).replace(",", "."));
    const lng = parseFloat(String(r.Longitudine).replace(",", "."));
    if (isNaN(lat) || isNaN(lng)) { senzaCoord++; return; }
    if (filtro && r.Tipo !== filtro) return;

    const c = colore(r.Tipo);
    const righeInfo = [
      r.Tipo && `<em>${esc(r.Tipo)}</em>`,
      r.Titolo && `Titolo: ${esc(r.Titolo)}`,
      r.Codice && `Codice: ${esc(r.Codice)}`,
      r.Delimitato_da && `Delimitato da: ${esc(r.Delimitato_da)}`,
      r.Data && `Data: ${esc(r.Data)}`,
      r.Luogo && `<small>${esc(r.Luogo)}</small>`
    ].filter(Boolean).join("<br>");

    L.circleMarker([lat, lng], {
      radius: 7, color: "#fff", weight: 1.5, fillColor: c, fillOpacity: 0.9
    }).bindPopup(`<strong>${esc(r.Nome)}</strong><br>${righeInfo}`).addTo(layer);
    punti.push([lat, lng]);
  });

  stato.textContent = `${punti.length} luoghi sulla mappa` + (senzaCoord ? ` (${senzaCoord} senza coordinate)` : "");
  return punti;
}

function aggiornaSelect() {
  const corrente = select.value;
  const tipi = [...new Set(righe.map(r => r.Tipo).filter(Boolean))].sort();
  select.innerHTML = '<option value="">Tutti</option>' +
    tipi.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  if (tipi.includes(corrente)) select.value = corrente;
}

function carica(primaVolta) {
  // il parametro t evita risposte in cache
  const url = CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
  Papa.parse(url, {
    download: true, header: true, skipEmptyLines: true,
    complete: res => {
      righe = res.data;
      aggiornaSelect();
      const punti = disegna();
      if (primaVolta && punti.length) map.fitBounds(punti, { padding: [30, 30] });
    },
    error: () => { stato.textContent = "Errore nel caricamento dei dati"; }
  });
}

select.addEventListener("change", () => {
  const punti = disegna();
  if (punti.length) map.fitBounds(punti, { padding: [30, 30], maxZoom: 10 });
});

carica(true);
setInterval(() => carica(false), REFRESH_MS);
</script>
</body>
</html>
